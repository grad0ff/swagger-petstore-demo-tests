# Variables
property.filepath=../.logs
property.filename=swagger-petstore
property.layout_charset=UTF-8
property.layout_pattern=[%-4level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] [%X{allureId}] %c{1} - %msg%n

# Appenders
appenders=console, file

appender.console.type=Console
appender.console.name=stdout
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=${layout_pattern}
appender.console.layout.charset=${layout_charset}

appender.file.type=File
appender.file.name=logfile
appender.file.fileName=${filepath}/${filename}.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=${layout_pattern}
appender.file.layout.charset=${layout_charset}

# Root logger
rootLogger.level=info
rootLogger.appenderRefs=console, file
rootLogger.appenderRef.console.ref=stdout
rootLogger.appenderRef.file.ref=logfile
